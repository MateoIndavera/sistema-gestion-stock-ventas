<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movimientos</title>
  <link rel="stylesheet" href="./movimientos.css">
  <link rel="stylesheet" href="../../styles/global.css">
</head>
<body> 

    <header>
      <div class="app-info">
        <img src="../../img/iconoGestion.png" width="35px" height="35px">
        <h3>Gestionando</h3>
      </div>
      <div class="contenedor-user-right">
        <img class="imagen-user" src="../../img/IconoUser.png" width="40px" height="40px">
      </div>
    </header>

    <div class="contenedor-app">
    <aside class="sidebar">
      <ul>
        <li><a href="#">Ventas</a></li>
        <li class="user-navegando"><img src="../../img/IconoMovimientos.svg" width="20px" height="20px"><a href="#">Movimiento</a></li>
        <li><a href="#">Stock</a></li>
        <li><a href="#">Productos</a></li>
      </ul>
      </aside>


        <main>
            <div class="titulo-info">
              <h2>Movimientos</h2>
              <h5>Administrar movimientos de stock</h5>
            </div>

            <div class="section-mov">
              <h4>Nuevo movimiento</h4>

              <div class="select-type-mov">
                <p>Seleccionar tipo de operacion</p>

                <div class="options">
                  <input type="radio" name="tipo-movimiento" id="btn-ingreso">
                  <label for="btn-ingreso">Ingreso</label>
                  <input type="radio" name="tipo-movimiento" id="btn-salida">
                  <label for="btn-salida">Salida</label>
                </div>
              </div>
            </div>
        </main>

    </div>

</body>
</html>
